name: Build SpaceWarrior sprite preview

on:
  push:
    branches: [gfx-preview]
    paths:
      - 'gfx-preview/build_preview.py'
      - '.github/workflows/gfx-preview.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Pillow
        run: python -m pip install 'Pillow>=10,<13'
      - name: Build RGBA PNGs and static preview
        run: python gfx-preview/build_preview.py
      - name: Save generated PNGs and gallery to preview branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gfx-preview/assets gfx-preview/manifest.json gfx-preview/index.html
          if ! git diff --cached --quiet; then
            git commit -m "Generate browsable SpaceWarrior PNG sprite preview"
            git push origin HEAD:gfx-preview
          fi
