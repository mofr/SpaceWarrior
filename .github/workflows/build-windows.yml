name: Build SpaceWarrior for Windows
on:
  push:
    branches: [windows-modern-build-2026]
  workflow_dispatch:

jobs:
  win32:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Free Pascal
        shell: pwsh
        run: |
          choco install freepascal --yes --no-progress
          $compiler = Get-ChildItem 'C:\tools', 'C:\FPC', 'C:\Program Files' -Recurse -Filter fpc.exe -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match '(i386-win32|freepascal)' } | Select-Object -First 1 -ExpandProperty FullName
          if (-not $compiler) { throw "FPC compiler not found" }
          "FPC_EXECUTABLE=$compiler" >> $env:GITHUB_ENV
          & $compiler -iV

      - name: Attempt Win32 compilation
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path 'dist' -Force | Out-Null
          $ErrorActionPreference = 'Continue'
          & $env:FPC_EXECUTABLE '-Fu.' '-Fuinc' '-FEdist' '-omain.exe' 'main.pas' 2>&1 | Out-File -FilePath 'build.log' -Encoding utf8
          $rc = $LASTEXITCODE
          if ($rc -eq 0 -and (Test-Path 'dist/main.exe')) {
            Write-Host 'Compilation succeeded'
            'Freshly compiled using Free Pascal 3.2.2 for 32-bit Windows.' | Set-Content 'BUILD_STATUS.txt'
          } else {
            Write-Warning "Compiler failed with exit code $rc. See build.log. Packaging the original executable as fallback."
            'WARNING: Rebuild failed. main.exe is the original executable committed to the repository; NOT a new build. See build.log.' | Set-Content 'BUILD_STATUS.txt'
            Copy-Item 'main.exe' 'dist/main.exe'
          }

      - name: Package game assets and dependencies
        shell: pwsh
        run: |
          Copy-Item 'bass.dll' 'dist/'
          Copy-Item 'config.cfg' 'dist/'
          foreach ($dir in @('asteroids','bullets','effects','fld_gen','gfx','levels','media','particles','pilots','saved_games','sfx','ships')) {
            if (Test-Path $dir) { Copy-Item $dir ('dist/' + $dir) -Recurse -Force }
          }
          foreach ($file in @('descr-eng.txt','descr-rus.txt','intro.txt','item_panel.txt','panel.txt')) {
            if (Test-Path $file) { Copy-Item $file 'dist/' }
          }
          Copy-Item 'BUILD_STATUS.txt' 'dist/'
          Copy-Item 'build.log' 'dist/'
          @'
          SPACE WARRIOR - Windows package

          Unzip ALL files to a writable folder, then start main.exe.
          This is a 32-bit Windows program using old DirectDraw and BASS.
          Modern Windows 10/11 compatibility is not guaranteed.
          If graphics fail, try Windows compatibility settings / DirectDraw wrapper (e.g. dgVoodoo2).
          Check BUILD_STATUS.txt to see whether main.exe was freshly compiled or original.
          '@ | Set-Content 'dist/READ_ME_FIRST.txt'

      - uses: actions/upload-artifact@v4
        with:
          name: SpaceWarrior-Windows
          path: dist/
          if-no-files-found: error
          retention-days: 30
